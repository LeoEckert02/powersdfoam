# Experiment parameters
iterations: 30_000
densify_from: 1_000
densify_until: 24_000
normal_weight: 0.1
contribution_weight: 0.1
interpenetration_weight: 1e-4

# Dataset parameters
dataset: "blender"
data_path: "/storage/user/eckertle/sss-gs/synthetic/soap"
scene: "soap"
alpha_format_on_disk: "straight"
downsample: [2, 1]
downsample_iterations: [0, 500]
is_pinhole: true
eval: true

# Model parameters
init_type: "sfm"
init_points: 40_000
final_points: 150_000
bkgd_color: [0.0, 0.0, 0.0]
render_objective: "volume"
sv_dof: 8
num_texel_sites: 8
use_metric3d: true

# Optimization parameters
points_lr_init: 1e-3
points_lr_final: 5e-5
density_lr_init: 1e0
density_lr_final: 1e0
radii_lr_init: 5e-5
radii_lr_final: 5e-6
quaternions_lr_init: 1e-1
quaternions_lr_final: 1e-2
texel_sites_lr_init: 1e-2
texel_sites_lr_final: 1e-3
texel_sv_axis_lr_init: 5e-2
texel_sv_axis_lr_final: 5e-3
texel_sv_rgb_lr_init: 5e-3
texel_sv_rgb_lr_final: 5e-4
texel_height_lr_init: 5e-3
texel_height_lr_final: 5e-4
# SDF parameters (SDFoam integration)
use_sdf: true
sdf_hidden_dim: 256
sdf_n_layers: 8
sdf_multires: 6
sdf_bias: 0.5
sdf_variance_init: 0.3
sdf_density_scale: 1.0
eikonal_weight: 0.01
sdf_bbox_samples: 8192
sdf_surface_samples: 2048
sdf_surface_sample_from: 7000
sdf_normal_weight: 0.05
sdf_lr_init: 5e-4
sdf_lr_final: 5e-5
variance_lr_init: 5e-3
variance_lr_final: 5e-6
